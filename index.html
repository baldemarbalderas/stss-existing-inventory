<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STSS Existing Inventory</title>
  <style>
    :root{
      --card:#ffffff;
      --primary:#1f6fd6;
      --muted:#6b7280;
      --border:#e5e7eb;
      --bg:#f6f7f9;
    }
    body{
      margin:0;
      background:#fff; /* make it feel like part of the page */
      font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:#111827;
    }
    .wrap{
      max-width:1400px;
      margin:0 auto;
      padding:18px 12px;
    }
    .title{font-size:28px;font-weight:900;margin:0 0 6px}
    .sub{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.4}

    .top{
      display:flex;
      align-items:flex-end;
      gap:12px;
      margin: 8px 0 14px;
    }

    .search{
      flex:1 1 520px; display:flex; gap:10px; align-items:center;
      min-width: 280px;
    }
    .search input{
      flex:1; padding:11px 12px; border:1px solid var(--border);
      border-radius:12px; outline:none; font-size:14px; background:#fff;
    }
    .search button{
      padding:11px 14px; border:none; border-radius:12px; cursor:pointer;
      background:var(--primary); color:#fff; font-weight:900; font-size:14px; white-space:nowrap;
    }

    .controls{
      display:flex;
      flex-direction:row;
      align-items:flex-end;
      gap:8px;
      flex:0 0 auto;
      min-width:0;
    }
    .controls label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    .controls select,.controls button{
      width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--border);
      background:#fff; font-size:14px;
    }
    .controls button{font-weight:900;cursor:pointer}
    .controls .primaryBtn{background:var(--primary);color:#fff;border:none}
    .msg{color:var(--muted);font-size:13px;margin:6px 0 0}

    .layout{
      display:grid;
      grid-template-columns: 300px 1fr;
      gap:18px;
      align-items:start;
    }
    .sidebar{ position:relative; }

    .filters{
      background:#fff;
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px;
      display:grid;
      gap:10px;
    }
    .filters .panelTitle{font-size:14px;font-weight:900;margin:0 0 6px}
    .fg label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}

    .filters input,
    .filters select{
      width:100%;
      height:44px;              /* forces equal field height */
      padding:0 10px;           /* horizontal padding only */
      border-radius:12px;
      border:1px solid var(--border);
      font-size:14px;
      line-height:44px;
      outline:none;
      background:#fff;
      box-sizing:border-box;
    }

    .filterActions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
    .filterActions .apply{background:var(--primary);color:#fff;border:none;padding:11px;border-radius:12px;font-weight:900;cursor:pointer}
    .filterActions .reset{background:#f3f4f6;border:1px solid var(--border);padding:11px;border-radius:12px;font-weight:900;cursor:pointer}

    .resultsBar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}
    .count{color:var(--muted);font-size:13px}

    .grid{display:grid;grid-template-columns: repeat(auto-fill, minmax(260px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
    .card img{width:100%;height:170px;object-fit:cover;display:block;background:#f3f4f6}
    .b{padding:12px;display:flex;flex-direction:column;gap:6px}
    .name{margin:0;font-size:16px;font-weight:900;line-height:1.15}
    .meta{font-size:12px;color:var(--muted)}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
    .tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#f3f4f6;border:1px solid #eef2f7}
    .priceRow{display:flex;gap:10px;align-items:baseline;margin-top:4px}
    .price{font-size:18px;font-weight:900}
    .strike{color:var(--muted);text-decoration:line-through;font-weight:700;font-size:13px}
    .actions{margin-top:auto;display:flex;gap:8px}
    .actions a{
      flex:1;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      cursor:pointer;
      font-weight:900;
      font-size:14px;
      text-align:center;
      text-decoration:none;
      color:#111827;
      display:inline-block;
    }
    .actions a.primary{background:var(--primary);color:#fff;border:none}

    /* Financing dropdown with arrow indicator */
    .actions .financingSelect{
      flex: 1;
      height: 44px;
      padding: 10px 38px 10px 12px; /* space for arrow */
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: #fff;
      font-weight: 900;
      font-size: 14px;
      color: #111827;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image:
        url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\
<polyline points='6 9 12 15 18 9'/>\
</svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
    }
    .actions .financingSelect:hover{ background-color:#f9fafb; }

    @media (max-width: 980px){
      .layout{grid-template-columns:1fr}
      .sidebar{position:relative;top:auto}
      .controls{flex:1 1 360px}
      .top{flex-wrap:wrap}
    }

    /* hide Sync if you want */
    #btnSync{ display:none; }

    /* Smaller reset button */
    #btnResetTop{
      padding:8px 12px;
      font-size:13px;
      height:44px;
      width:auto;
      white-space:nowrap;
    }
    #sort{ min-width:180px; height:44px; }
    #btnSearch{ height:44px; }

    /* ===== STSS MODAL ===== */
    .stss-modal-backdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:24px;
      z-index:9999;
    }
    .stss-modal-backdrop.is-open{ display:flex; }

    .stss-modal{
      width:min(980px, 100%);
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      position:relative;
    }
    .stss-modal-close{
      position:absolute; top:10px; right:12px;
      width:36px; height:36px;
      border:0; border-radius:10px;
      background:rgba(0,0,0,.06);
      font-size:22px; cursor:pointer;
    }
    .stss-modal-grid{
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      gap:0;
    }
    @media (max-width: 900px){
      .stss-modal-grid{ grid-template-columns: 1fr; }
    }
    .stss-modal-media{ background:#f3f5f7; }
    .stss-modal-media img{
      width:100%;
      height:100%;
      max-height:520px;
      object-fit:cover;
      display:block;
    }
    .stss-modal-content{ padding:18px 18px 20px; }
    .stss-modal-kicker{ font-size:12px; opacity:.7; margin-bottom:4px; }
    .stss-modal-title{ font-size:20px; line-height:1.2; margin:0 0 10px; }

    .stss-modal-meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      font-size:13px;
      margin-bottom:10px;
    }
    .stss-chip{
      padding:4px 8px;
      border:1px solid #e6e9ee;
      border-radius:999px;
      background:#fafbfc;
    }

    .stss-modal-price{
      display:flex;
      align-items:baseline;
      gap:10px;
      margin:10px 0 12px;
    }
    .stss-price-main{ font-size:22px; font-weight:800; }
    .stss-price-sale{ font-size:14px; opacity:.65; text-decoration:line-through; }

    .stss-modal-badges{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:12px;
    }
    .stss-badge{
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      background:#eef6ff;
    }

    #stssModalNotesWrap{ display:none; }
    #stssModalNotesWrap.is-on{ display:block; }
    .stss-modal-notes-label{
      font-weight:700;
      font-size:12px;
      opacity:.75;
      margin-bottom:6px;
    }

    .stss-modal-actions{
      display:flex;
      gap:10px;
      margin-top:16px;
      flex-wrap:wrap;
    }
    .stss-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e6e9ee;
      background:#fff;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      color:#111827;
    }
    .stss-btn-primary{
      background:#1677ff;
      color:#fff;
      border-color:#1677ff;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="search">
        <input id="q" placeholder="Search by title, SKU, color, location, notes…" />
        <button id="btnSearch" type="button">Search</button>
      </div>

      <div class="controls">
        <div>
          <select id="sort">
            <option value="newest">Sort: Newest</option>
            <option value="price_asc">Price: Low → High</option>
            <option value="price_desc">Price: High → Low</option>
            <option value="width_asc">Width: Small → Large</option>
            <option value="width_desc">Width: Large → Small</option>
            <option value="length_asc">Length: Small → Large</option>
            <option value="length_desc">Length: Large → Small</option>
            <option value="area_desc">Area: Largest</option>
            <option value="area_asc">Area: Smallest</option>
          </select>
        </div>

        <button class="primaryBtn" id="btnSync" type="button">Sync</button>
        <button id="btnResetTop" type="button">Reset</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="filters">
          <div class="panelTitle">Filter Inventory</div>

          <div class="fg"><label>Location</label><select id="fLoc"><option value="">All</option></select></div>
          <div class="fg"><label>Type</label><select id="fType"><option value="">All</option></select></div>
          <div class="fg"><label>Roof</label><select id="fRoof"><option value="">Any</option></select></div>

          <div class="fg"><label>Width Min (ft)</label><input id="wMin" placeholder="e.g. 10" inputmode="numeric" /></div>
          <div class="fg"><label>Width Max (ft)</label><input id="wMax" placeholder="e.g. 14" inputmode="numeric" /></div>
          <div class="fg"><label>Length Min (ft)</label><input id="lMin" placeholder="e.g. 16" inputmode="numeric" /></div>
          <div class="fg"><label>Length Max (ft)</label><input id="lMax" placeholder="e.g. 24" inputmode="numeric" /></div>

          <div class="fg"><label>Color</label><select id="fColor"><option value="">Any</option></select></div>
          <div class="fg"><label>Max Price ($)</label><input id="pMax" placeholder="e.g. 15000" inputmode="numeric" /></div>
          <div class="fg"><label>Availability</label><select id="fAvail"><option value="">Any</option></select></div>

          <div class="filterActions">
            <button id="btnApply" class="apply" type="button">Apply Filters</button>
            <button id="btnReset" class="reset" type="button">Reset</button>
          </div>
        </div>
      </aside>

      <main>
        <div class="resultsBar">
          <div class="count" id="count">Loading…</div>
        </div>
        <div class="grid" id="grid"></div>
      </main>
    </div>
  </div>

  <!-- ITEM DETAIL MODAL -->
  <div id="stssModalBackdrop" class="stss-modal-backdrop" aria-hidden="true">
    <div class="stss-modal" role="dialog" aria-modal="true" aria-labelledby="stssModalTitle">
      <button class="stss-modal-close" id="stssModalClose" aria-label="Close">×</button>

      <div class="stss-modal-grid">
        <div class="stss-modal-media">
          <img id="stssModalImg" alt="Inventory image" />
        </div>

        <div class="stss-modal-content">
          <div class="stss-modal-kicker" id="stssModalSku"></div>
          <h2 id="stssModalTitle" class="stss-modal-title"></h2>

          <div class="stss-modal-meta" id="stssModalMeta"></div>

          <div class="stss-modal-price">
            <div class="stss-price-main" id="stssModalPrice"></div>
            <div class="stss-price-sale" id="stssModalSale"></div>
          </div>

          <div class="stss-modal-badges" id="stssModalBadges"></div>

          <div id="stssModalNotesWrap">
            <div class="stss-modal-notes-label">Notes</div>
            <div id="stssModalNotes"></div>
          </div>

          <div class="stss-modal-actions">
            <a class="stss-btn stss-btn-primary" id="stssModalCall" href="#">Call</a>
            <a class="stss-btn" id="stssModalText" href="#">Text</a>
            <a class="stss-btn" id="stssModalFinancing" href="#" target="_blank" rel="noopener">Financing</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ✅ Your live CSV URL (pub -> output=csv)
    const GOOGLE_SHEETS_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vToQBXpgvNoKGYKw5iXFfkWLVhEhzQtv_Yn_21X0SBFM-CDLlnv-OSZLwzz3s1I9JstwAgyomaJ4fkH/pub?gid=1180471110&single=true&output=csv";

    /* ======================= LENDER LINKS ======================= */
    const links = {
      acorn: "https://www.acornfinance.com/pre-qualify/?d=OG3SM&utm_medium=web_pre_qual_link&loanAmount=70000#/personal",
      hfs: "https://www.hfsfinancial.net/promo/680bd658016f111f82588af6/",
      hearth: "https://app.gethearth.com/partners/south-texas-steel-studs-inc?utm_campaign=56100&utm_content=zero_percent&utm_medium=contractor-website&utm_source=contractor&utm_term=310x610"
    };

    function goFinance(val){
      if(!val) return;
      const url = links[val];
      if(url) window.open(url, "_blank", "noopener,noreferrer");
    }

    let items = [];
    const $ = (id) => document.getElementById(id);

    const msg = $('msg');
    const grid = $('grid');
    const count = $('count');

    const q = $('q');
    const sort = $('sort');

    const wMin = $('wMin'), wMax = $('wMax');
    const lMin = $('lMin'), lMax = $('lMax');

    const fType = $('fType'), fRoof = $('fRoof'), fAvail = $('fAvail'), fLoc = $('fLoc'), fColor = $('fColor');
    const pMax = $('pMax');

    const num = (v) => {
      const n = parseFloat(String(v ?? '').replace(/[^0-9.]/g,''));
      return Number.isFinite(n) ? n : null;
    };
    const normalizeYesNo = (v) => {
      const s = String(v ?? '').trim().toLowerCase();
      return (s === 'yes' || s === 'y' || s === 'true' || s === '1');
    };
    const splitImages = (v) => String(v ?? '').trim().split('|').map(x=>x.trim()).filter(Boolean);
    const uniqueSorted = (arr) => Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>String(a).localeCompare(String(b)));

    function rebuildDropdown(selectEl, values, firstLabel){
      const prev = selectEl.value;
      selectEl.innerHTML = ⁠ <option value="">${firstLabel}</option> ⁠ + values.map(v => ⁠ <option value="${String(v)}">${String(v)}</option> ⁠).join('');
      const ok = Array.from(selectEl.options).some(o => o.value === prev);
      selectEl.value = ok ? prev : '';
    }

    function hydrateFiltersFromItems(){
      rebuildDropdown(fType,  uniqueSorted(items.map(x=>x.type)), 'All');
      rebuildDropdown(fRoof,  uniqueSorted(items.map(x=>x.roof)), 'Any');
      rebuildDropdown(fAvail, uniqueSorted(items.map(x=>x.availability)), 'Any');
      rebuildDropdown(fLoc,   uniqueSorted(items.map(x=>x.location)), 'All');
      rebuildDropdown(fColor, uniqueSorted(items.map(x=>x.color)), 'Any');
    }

    function priceToUse(x){
      const sale = num(x.sale);
      const price = num(x.price);
      if(sale !== null && sale > 0) return sale;
      return (price !== null ? price : 0);
    }

    function parseCSV(text){
      const rows = [];
      let i=0, field='', row=[], inQuotes=false;
      while(i < text.length){
        const c = text[i];
        if(inQuotes){
          if(c === '"'){
            if(text[i+1] === '"'){ field += '"'; i += 2; continue; }
            inQuotes = false; i++; continue;
          }
          field += c; i++; continue;
        } else {
          if(c === '"'){ inQuotes = true; i++; continue; }
          if(c === ','){ row.push(field); field=''; i++; continue; }
          if(c === '\n'){ row.push(field); rows.push(row); field=''; row=[]; i++; continue; }
          if(c === '\r'){ i++; continue; }
          field += c; i++; continue;
        }
      }
      row.push(field);
      rows.push(row);
      return rows.filter(r => r.some(x => String(x).trim() !== ''));
    }

    function render(list){
      window.__STSS_ITEMS = list; // so View can open the correct item
      count.textContent = ⁠ Showing ${list.length} result${list.length===1?'':'s'} ⁠;

      grid.innerHTML = list.map((x, index) => {
        const w = num(x.width) ?? 0;
        const l = num(x.length) ?? 0;
        const area = w*l;

        const sale = num(x.sale);
        const price = num(x.price);
        const p = priceToUse(x);

        const img = splitImages(x.images)[0] || 'https://southtexassteelstuds.com/wp-content/uploads/2026/01/placeholder.png';
        const badges = String(x.badges ?? '').split('|').map(t=>t.trim()).filter(Boolean);

        const tagLoc = x.location ? ⁠ <span class="tag">${x.location}</span> ⁠ : '';
        const tagAvail = x.availability ? ⁠ <span class="tag">${x.availability}</span> ⁠ : '';
        const tagColor = x.color ? ⁠ <span class="tag">${x.color}</span> ⁠ : '';
        const badgeTags = badges.slice(0,3).map(b=>⁠ <span class="tag">${b}</span> ⁠).join('');

        const strike = (sale !== null && sale > 0 && price !== null && price > sale)
          ? ⁠ <div class="strike">$${Number(price).toLocaleString()}</div> ⁠
          : '';

        const metaParts = [
          x.sku ? x.sku : '',
          x.type ? x.type : '',
          x.roof ? x.roof : '',
          (w && l) ? ⁠ ${w}×${l} (${area} sf) ⁠ : ''
        ].filter(Boolean).join(' · ');

        return `
          <div class="card">
            <img src="${img}" alt="">
            <div class="b">
              <h3 class="name">${x.title || x.sku || 'Inventory Item'}</h3>
              <div class="meta">${metaParts}</div>

              <div class="tags">
                ${tagLoc}${tagAvail}${tagColor}${badgeTags}
              </div>

              <div class="priceRow">
                <div class="price">$${Number(p).toLocaleString()}</div>
                ${strike}
              </div>

              <div class="actions">
                <a class="primary btn-view" data-idx="${index}" href="#" onclick="return false;">View</a>

                <select
                  class="financingSelect"
                  onchange="goFinance(this.value); this.value='';"
                  onclick="event.stopPropagation();"
                >
                  <option value="">Financing</option>
                  <option value="acorn">Acorn</option>
                  <option value="hfs">HFS</option>
                  <option value="hearth">Hearth</option>
                </select>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function apply(){
      let out = items.slice().filter(x => normalizeYesNo(x.show));

      const term = (q.value||"").trim().toLowerCase();
      if(term){
        out = out.filter(x =>
          (String(x.title||'')+' '+String(x.sku||'')+' '+String(x.type||'')+' '+String(x.roof||'')+' '+String(x.color||'')+' '+String(x.location||'')+' '+String(x.notes||''))
            .toLowerCase().includes(term)
        );
      }

      const wmin = num(wMin.value), wmax = num(wMax.value);
      const lmin = num(lMin.value), lmax = num(lMax.value);
      const pmax = num(pMax.value);

      if(wmin !== null) out = out.filter(x => (num(x.width) ?? 0) >= wmin);
      if(wmax !== null) out = out.filter(x => (num(x.width) ?? 0) <= wmax);
      if(lmin !== null) out = out.filter(x => (num(x.length) ?? 0) >= lmin);
      if(lmax !== null) out = out.filter(x => (num(x.length) ?? 0) <= lmax);

      if(fType.value)  out = out.filter(x => String(x.type||'') === fType.value);
      if(fRoof.value)  out = out.filter(x => String(x.roof||'') === fRoof.value);
      if(fAvail.value) out = out.filter(x => String(x.availability||'') === fAvail.value);
      if(fLoc.value)   out = out.filter(x => String(x.location||'') === fLoc.value);
      if(fColor.value) out = out.filter(x => String(x.color||'') === fColor.value);

      if(pmax !== null) out = out.filter(x => priceToUse(x) <= pmax);

      const area = (x) => (num(x.width) ?? 0) * (num(x.length) ?? 0);
      switch(sort.value){
        case 'price_asc': out.sort((a,b)=>priceToUse(a)-priceToUse(b)); break;
        case 'price_desc': out.sort((a,b)=>priceToUse(b)-priceToUse(a)); break;
        case 'width_asc': out.sort((a,b)=>(num(a.width)??0)-(num(b.width)??0)); break;
        case 'width_desc': out.sort((a,b)=>(num(b.width)??0)-(num(a.width)??0)); break;
        case 'length_asc': out.sort((a,b)=>(num(a.length)??0)-(num(b.length)??0)); break;
        case 'length_desc': out.sort((a,b)=>(num(b.length)??0)-(num(a.length)??0)); break;
        case 'area_asc': out.sort((a,b)=>area(a)-area(b)); break;
        case 'area_desc': out.sort((a,b)=>area(b)-area(a)); break;
        default: break;
      }

      render(out);
    }

    function resetAll(){
      q.value=""; sort.value="newest";
      wMin.value=""; wMax.value=""; lMin.value=""; lMax.value="";
      fType.value=""; fRoof.value=""; fAvail.value=""; fLoc.value=""; fColor.value="";
      pMax.value="";
      apply();
    }

    async function sync(){
      msg.textContent = "Syncing…";
      try{
        const res = await fetch(GOOGLE_SHEETS_CSV_URL, { cache: "no-store" });
        if(!res.ok) throw new Error(⁠ HTTP ${res.status} ⁠);
        const text = await res.text();

        const rows = parseCSV(text);
        if(rows.length < 2) throw new Error("CSV empty");

        const header = rows[0].map(h => String(h).trim());
        const idx = (name) => header.findIndex(h => h.toLowerCase() === name.toLowerCase());

        const i = {
          SKU: idx('SKU'),
          Title: idx('Title'),
          Type: idx('Type'),
          Width: idx('Width'),
          Length: idx('Length'),
          Roof: idx('Roof'),
          Color: idx('Color'),
          Price: idx('Price'),
          Sale: idx('Sale'),
          Availability: idx('Availability'),
          Location: idx('Location'),
          Images: idx('Images'),
          Badges: idx('Badges'),
          Notes: idx('Notes'),
          Added: idx('Added'),
          Show: idx('Show')
        };

        items = rows.slice(1).map(r => ({
          sku: i.SKU>-1 ? r[i.SKU] : '',
          title: i.Title>-1 ? r[i.Title] : '',
          type: i.Type>-1 ? r[i.Type] : '',
          width: i.Width>-1 ? r[i.Width] : '',
          length: i.Length>-1 ? r[i.Length] : '',
          roof: i.Roof>-1 ? r[i.Roof] : '',
          color: i.Color>-1 ? r[i.Color] : '',
          price: i.Price>-1 ? r[i.Price] : '',
          sale: i.Sale>-1 ? r[i.Sale] : '',
          availability: i.Availability>-1 ? r[i.Availability] : '',
          location: i.Location>-1 ? r[i.Location] : '',
          images: i.Images>-1 ? r[i.Images] : '',
          badges: i.Badges>-1 ? r[i.Badges] : '',
          notes: i.Notes>-1 ? r[i.Notes] : '',
          added: i.Added>-1 ? r[i.Added] : '',
          show: i.Show>-1 ? r[i.Show] : 'Yes'
        }));

        hydrateFiltersFromItems();
        resetAll();
        msg.textContent = "Synced.";
      }catch(e){
        msg.textContent = "Sync failed. Confirm the Sheet is Published to web and output=csv works.";
        count.textContent = "Unable to load inventory.";
        grid.innerHTML = "";
      }
    }

    $('btnSync').addEventListener('click', sync);
    $('btnSearch').addEventListener('click', apply);
    $('btnApply').addEventListener('click', apply);
    $('btnReset').addEventListener('click', resetAll);
    $('btnResetTop').addEventListener('click', resetAll);

    // inputs
    [q, wMin, wMax, lMin, lMax, pMax].forEach(n => n.addEventListener('input', apply));
    // selects
    [fType, fRoof, fAvail, fLoc, fColor].forEach(s => s.addEventListener('change', apply));
    sort.addEventListener('change', apply);

    sync(); // auto-load
  </script>

  <script>
    // ===== STSS MODAL LOGIC (Option 1) =====
    const STSS_PHONE = "9562523997";
    const STSS_PHONE_DISPLAY = "(956) 252-3997";

    const $backdrop = document.getElementById("stssModalBackdrop");
    const $closeBtn = document.getElementById("stssModalClose");

    const $img   = document.getElementById("stssModalImg");
    const $sku   = document.getElementById("stssModalSku");
    const $title = document.getElementById("stssModalTitle");
    const $meta  = document.getElementById("stssModalMeta");
    const $price = document.getElementById("stssModalPrice");
    const $sale  = document.getElementById("stssModalSale");
    const $badges= document.getElementById("stssModalBadges");
    const $notesWrap = document.getElementById("stssModalNotesWrap");
    const $notes = document.getElementById("stssModalNotes");

    const $call = document.getElementById("stssModalCall");
    const $text = document.getElementById("stssModalText");
    const $fin  = document.getElementById("stssModalFinancing");

    function money(n){
      const num = Number(String(n).replace(/[^0-9.]/g,""));
      if (!isFinite(num)) return "";
      return num.toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:0});
    }

    function firstImage(images){
      if(!images) return "";
      const s = String(images).trim();
      const parts = s.split(/[|,]/).map(x=>x.trim()).filter(Boolean);
      return parts[0] || "";
    }

    function openItemModal(item){
      const imgUrl = firstImage(item.images || "");
      $img.src = imgUrl || "https://via.placeholder.com/1200x800?text=STSS+Inventory";

      $sku.textContent = item.sku ? ⁠ SKU: ${item.sku} ⁠ : "";
      $title.textContent = item.title || "Inventory Item";

      const chips = [];
      if(item.type) chips.push(⁠ Type: ${item.type} ⁠);
      if(item.width) chips.push(⁠ Width: ${item.width} ft ⁠);
      if(item.length) chips.push(⁠ Length: ${item.length} ft ⁠);
      if(item.roof) chips.push(⁠ Roof: ${item.roof} ⁠);
      if(item.color) chips.push(⁠ Color: ${item.color} ⁠);
      if(item.availability) chips.push(⁠ Status: ${item.availability} ⁠);
      if(item.location) chips.push(⁠ Location: ${item.location} ⁠);

      $meta.innerHTML = chips.map(t=>⁠ <span class="stss-chip">${t}</span> ⁠).join("");

      const p = money(item.price);
      const s = money(item.sale);

      const saleNum = Number(String(item.sale).replace(/[^0-9.]/g,""));
      const priceNum = Number(String(item.price).replace(/[^0-9.]/g,""));

      if (s && p && isFinite(saleNum) && isFinite(priceNum) && saleNum < priceNum){
        $price.textContent = s;
        $sale.textContent = p;
        $sale.style.display = "inline";
      } else {
        $price.textContent = p || s || "";
        $sale.textContent = "";
        $sale.style.display = "none";
      }

      const badgeText = (item.badges || "").toString();
      const badgeList = badgeText.split(/[|,]/).map(x=>x.trim()).filter(Boolean);
      $badges.innerHTML = badgeList.map(b=>⁠ <span class="stss-badge">${b}</span> ⁠).join("");

      const notesText = (item.notes || "").toString().trim();
      if (notesText){
        $notesWrap.classList.add("is-on");
        $notes.textContent = notesText;
      } else {
        $notesWrap.classList.remove("is-on");
        $notes.textContent = "";
      }

      const smsMsg = encodeURIComponent(⁠ Hi STSS, I’m interested in ${item.sku ? item.sku + " — " : ""}${item.title || "this unit"}. Is it still available? ⁠);
      $call.href = ⁠ tel:${STSS_PHONE} ⁠;
      $call.textContent = ⁠ Call ${STSS_PHONE_DISPLAY} ⁠;
      $text.href = ⁠ sms:${STSS_PHONE}?&body=${smsMsg} ⁠;
      $text.textContent = "Text this unit";

      const defaultFinancingUrl = "https://southtexassteelstuds.com/financing/";
      $fin.href = defaultFinancingUrl;

      $backdrop.classList.add("is-open");
      $backdrop.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
    }

    function closeItemModal(){
      $backdrop.classList.remove("is-open");
      $backdrop.setAttribute("aria-hidden","true");
      document.body.style.overflow = "";
    }

    $closeBtn.addEventListener("click", closeItemModal);
    $backdrop.addEventListener("click", (e)=>{
      if(e.target === $backdrop) closeItemModal();
    });
    window.addEventListener("keydown", (e)=>{
      if(e.key === "Escape") closeItemModal();
    });

    // Wire View buttons
    document.addEventListener("click", (e)=>{
      const btn = e.target.closest(".btn-view");
      if(!btn) return;
      const idx = Number(btn.dataset.idx);
      const arr = window.__STSS_ITEMS || [];
      if (!isFinite(idx) || !arr[idx]) return;
      openItemModal(arr[idx]);
    });
  </script>
</body>
</html>
